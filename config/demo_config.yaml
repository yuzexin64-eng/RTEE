# Legacy GPS/grid/emissions demonstration only; not the paper's economic module.
input_files:
  gps_points: data/demo/gps_points_sample.csv
  vehicle_static: data/demo/vehicle_static_sample.csv
output_files:
  grid_daily_summary: outputs/demo/grid_daily_summary.csv
event_windows:
  pre_event:
    start: "2023-09-18 00:00:00"
    end: "2023-09-18 23:59:59"
  rainfall_period:
    start: "2023-09-19 00:00:00"
    end: "2023-09-19 23:59:59"
aggregation:
  group_by:
    - grid_id_10km
    - event_window
  metrics:
    distance_km: sum
    duration_min: sum
    co2_g_demo: sum
    plate_id_hash: nunique
